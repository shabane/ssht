name: Build and Release Go App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Cross-Platform binaries
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build for Linux (amd64)
      env:
        GOOS: linux
        GOARCH: amd64
      run: go build -o ssht-linux-amd64 .

    - name: Build for macOS (amd64)
      env:
        GOOS: darwin
        GOARCH: amd64
      run: go build -o ssht-darwin-amd64 .

    - name: Build for macOS (arm64/Apple Silicon)
      env:
        GOOS: darwin
        GOARCH: arm64
      run: go build -o ssht-darwin-arm64 .

    - name: Create GitHub Release and Upload Artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ssht-linux-amd64
          ssht-darwin-amd64
          ssht-darwin-arm64
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
